<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chord Encyclopedia</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Chord Encyclopedia</h1>
      <p class="subtitle">Pick a note and a chord to see it on the piano.</p>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Open settings" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="menu" id="menu" aria-label="Settings" hidden>
    <div class="menu-head">
      <h2>Settings</h2>
      <div class="menu-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Switch to dark mode" title="Dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" id="menuClose" aria-label="Close settings">✕</button>
      </div>
    </div>
    <label class="switch-row">
      <span><b>Beginner mode</b><small>Basic chords only, no formula, simpler note names.</small></span>
      <input type="checkbox" id="optBeginner" role="switch">
    </label>
    <label class="switch-row" id="rowAvoid">
      <span><b>Avoid double sharps &amp; flats</b><small>Shows G instead of Fx. The formula keeps the exact spelling.</small></span>
      <input type="checkbox" id="optAvoid" role="switch">
    </label>
    <label class="switch-row" id="rowOdd">
      <span><b>Avoid C♭, B♯, E♯ &amp; F♭</b><small>Shows B, C, F and E instead. Turn off to see them.</small></span>
      <input type="checkbox" id="optOdd" role="switch">
    </label>
    <label class="switch-row">
      <span><b>Chord on the bottom</b><small>Experimental. The chord sits at the bottom of the wheels, with earlier choices above it.</small></span>
      <input type="checkbox" id="optBottom" role="switch">
    </label>
    <a class="switch-row link-row" href="https://sociabuzz.com/ecpi_x/tribe" target="_blank" rel="noopener noreferrer">
      <span><b>☕ Enjoying this? Show some love ❤️</b></span>
    </a>
    <div class="menu-foot"><small>Beta v0.1</small></div>
  </aside>

  <main>
    <section class="pickers" id="pickers">
      <div class="hl" aria-hidden="true"></div>
      <div class="pickcol">
        <div class="picker" id="rootPicker" data-side="left" aria-label="Root note"></div>
        <div class="accidentals" id="accidentals" role="group" aria-label="Sharps or flats">
          <button data-mode="mix" aria-pressed="true" title="Auto: mixed sharps and flats" aria-label="Auto">♯♭</button>
          <button data-mode="sharp" aria-pressed="false" title="Use sharps" aria-label="Sharps">♯</button>
          <button data-mode="flat" aria-pressed="false" title="Use flats" aria-label="Flats">♭</button>
        </div>
      </div>
      <div class="pickcol">
        <div class="picker" id="qualityPicker" data-side="right" aria-label="Chord type"></div>
      </div>
    </section>

    <section class="result">
      <h2 id="chordTitle"></h2>
      <p id="chordFull"></p>
      <table id="noteTable"></table>
    </section>

    <div id="piano"></div>
    <p class="aliases" id="aliases"></p>
  </main>

  <footer>
    <a class="support" href="https://sociabuzz.com/ecpi_x/tribe" target="_blank" rel="noopener noreferrer">☕ Enjoying this? Show some love ❤️</a>
    <p>© 2026 <a href="https://www.skool.com/ecpiano-1707" target="_blank" rel="noopener noreferrer">ecpiano</a></p>
  </footer>

  <script src="chords.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
